<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://kit.fontawesome.com/13c3317458.js" crossorigin="anonymous"></script>
    <script src="index.js" defer></script>
</head>
<body class="flex">
    <h1>Tic Tac Toe</h1>
    <button onclick="start(1)">1 Player</button>
    <button onclick="start(2)">2 Player</button>
    <div class="flex">
        <button onclick="volume_btn()"><i class="fa-solid fa-volume vol"></i><i class="fa-solid fa-volume-xmark mute"></i></button>
        <button onclick="credits()"><i class="fa-solid fa-newspaper"></i></button>
        <button><i class="fa-solid fa-comment-dots"></i></button>
    </div>
    <dialog id="popup">
        
    <div class="flex"><h2>Credits</h2><button class="cross" onclick="drop()">x</button></div>

    <p><strong>Developer:</strong> Atharva</p>
    <p><strong>Technologies:</strong> HTML, CSS, JavaScript</p>
    <p><strong>AI Assistance:</strong> ChatGPT (GPT-5.6 Luna)</p>
    </dialog>
</body>
</html>
