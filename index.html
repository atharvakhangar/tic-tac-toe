<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://kit.fontawesome.com/13c3317458.js" crossorigin="anonymous"></script>
    <script src="index.js" defer></script>
    
</head>
<body class="flex">
    <h1>Tic Tac Toe</h1>
    <button onclick="start(1)">1 Player</button>
    <button onclick="start(2)">2 Player</button>
    <div class="flex">
        <button onclick="volume_btn()"><i class="fa-solid fa-volume vol"></i><i class="fa-solid fa-volume-xmark mute"></i></button>
        <button onclick="credits('popup')"><i class="fa-solid fa-newspaper"></i></button>
        <button><i class="fa-solid fa-comment-dots"></i></button>
    </div>
    <decoration>
        <i class="fa-solid fa-xmark icon x" id="i1"></i>
        <i class="fa-regular fa-circle icon o" id="i2"></i>
        <i class="fa-solid fa-xmark icon x" id="i3"></i>
        <i class="fa-regular fa-circle icon o" id="i4"></i>
    </decoration>
    <dialog id="popup">
            
        <div class="flex"><h2>Credits</h2><button class="cross" onclick="drop('popup')">x</button></div>

<section class="credits"><br>

    <div class="developer">

        <h3>Font</h3>

            Khurasan Type<br>
            <a href="mailto:khurasantype@gmail.com">khurasantype@gmail.com</a><br>

                Creative Fabrica
            </a>
        </p><br><br>

        <h3>Audio</h3>
        <p>The_Mountain</p><br><br>

        <h3>Symbols &amp; Icons</h3>
        <p><a herf="https://fontawesome.com/">Font Awesome</a></p><br><br>
    </div>

    <div class="technologies">
        <h3>Technologies Used</h3>
        <p>HTML &bull; CSS &bull; Java<br>Script</p>
    </div>
</section>
    </dialog>
    <audio loop id="music">
        <source src="the_mountain-classical-piano-375979.mp3" type="audio/mp3">
    </audio>
    <dialog id="play">
        <div class="flex">        
            <h1>Tic Tac Toe</h1>
            <button onclick="drop('play'); volume_btn();"><h2>Enter</h2></button>
        </div>
    </dialog>
</body>
</html>
