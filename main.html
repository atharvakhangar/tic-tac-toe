<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="main.css">
    <script src="https://kit.fontawesome.com/13c3317458.js" crossorigin="anonymous"></script>
    <script src="main.js" defer></script>
</head>
<body class="flex">
    <h1>Tic Tac Toe</h1>
    <section>
        <table>
            <tr>
                <td data-row="0" data-colum="0"><div><i class="fa-solid fa-xmark icon x"></i><i class="fa-regular fa-circle icon o"></i></div></td>
                <td data-row="0" data-colum="1"><div><i class="fa-solid fa-xmark icon x"></i><i class="fa-regular fa-circle icon o"></i></div></td>
                <td data-row="0" data-colum="2"><div><i class="fa-solid fa-xmark icon x"></i><i class="fa-regular fa-circle icon o"></i></div></td>
            </tr>
            <tr>
                <td data-row="1" data-colum="0"><div><i class="fa-solid fa-xmark icon x"></i><i class="fa-regular fa-circle icon o"></i></div></td>
                <td data-row="1" data-colum="1"><div><i class="fa-solid fa-xmark icon x"></i><i class="fa-regular fa-circle icon o"></i></div></td>
                <td data-row="1" data-colum="2"><div><i class="fa-solid fa-xmark icon x"></i><i class="fa-regular fa-circle icon o"></i></div></td>
            </tr>
            <tr>
                <td data-row="2" data-colum="0"><div><i class="fa-solid fa-xmark icon x"></i><i class="fa-regular fa-circle icon o"></i></div></td>
                <td data-row="2" data-colum="1"><div><i class="fa-solid fa-xmark icon x"></i><i class="fa-regular fa-circle icon o"></i></div></td>
                <td data-row="2" data-colum="2"><div><i class="fa-solid fa-xmark icon x"></i><i class="fa-regular fa-circle icon o"></i></div></td>
            </tr>
        </table>
    </section>
</body>
</html>
